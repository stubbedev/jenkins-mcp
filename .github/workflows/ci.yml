name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    name: Go vet / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Verify formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o jenkins-mcp .

  nix:
    name: Nix flake build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Push every store path realised during this run to the attic cache.
      # Only runs on master pushes (not PRs / forks) where the token exists.
      - name: Configure attic cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: ryanccn/attic-action@v0
        with:
          endpoint: https://nix.stubbe.dev
          cache: default
          token: ${{ secrets.ATTIC_TOKEN }}
      - name: Build flake
        run: nix build .#default --print-build-logs
