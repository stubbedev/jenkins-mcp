name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    name: Go vet / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Verify formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o jenkins-mcp .

  nix:
    name: Nix flake build
    runs-on: ubuntu-latest
    # Exposed as env so the cache steps can be skipped when the secret is
    # absent — `secrets.*` is not allowed in a step-level `if:`.
    env:
      XILO_TOKEN: ${{ secrets.XILO_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build flake
        run: nix build .#default -L --print-out-paths | tee /tmp/outpaths

      # Push this build's closure to the self-hosted xilo cache so nix
      # consumers tracking master pull a prebuilt binary instead of
      # recompiling. Only on direct master pushes — PRs and forks have no
      # token. Replaces the old attic action: the cache moved to xilo and the
      # attic endpoint now 404s, which failed this job on every push.
      - name: setup xilo
        if: env.XILO_TOKEN != '' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: stubbedev/xilo@v1
        with:
          url: https://nix.stubbe.dev
          cache: default
          token: ${{ secrets.XILO_TOKEN }}

      - name: Push to xilo
        # Best-effort: a cache-push failure must not redden master CI.
        if: env.XILO_TOKEN != '' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        continue-on-error: true
        run: xilo push default $(cat /tmp/outpaths)
