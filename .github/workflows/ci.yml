name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go vet / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Verify formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build -o jenkins-mcp .

      - name: Smoke test
        run: node scripts/smoke.mjs

      - name: Node tests
        run: node --test 'scripts/*.test.mjs'

      # The Composer launcher only runs on users' machines, so lint it here.
      - name: Composer package
        run: |
          composer validate --strict
          for f in bin/jenkins-mcp src/*.php; do php -l "$f"; done

  nix:
    name: Nix flake build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: stubbedev/xilo@v2
        with:
          url: https://xilos.dev
          cache: stubbedev/main
          token: ${{ secrets.XILO_TOKEN }}
      - name: Build flake
        run: nix build .#default -L

