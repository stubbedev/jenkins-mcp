name: Nix vendorHash

# Keeps nix/package.nix's vendorHash in sync automatically. The flake version itself
# is read from package.json, so only vendorHash can drift — and only when the Go
# dependency set changes (e.g. a Dependabot bump). This recomputes it and commits
# the result back to master so `nix run github:stubbedev/jenkins-mcp` always builds.

on:
  push:
    branches: [master]
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://xilos.dev/c/stubbedev/main
            extra-trusted-public-keys = xilos.dev/stubbedev/main-1:397R6S49v/FSvP+mZ3HlKrVN1KXhgzHIEIHxA/UuG6Y=

      - name: Copy the flake source into the store
        run: nix flake archive

      - name: Recompute vendorHash
        run: nix run nixpkgs#nix-update -- --flake --version=skip jenkins-mcp

      - name: Commit if changed
        run: |
          if git diff --quiet nix/package.nix; then
            echo "vendorHash already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nix/package.nix
          git commit -m "chore(nix): update vendorHash"
          git push origin HEAD
